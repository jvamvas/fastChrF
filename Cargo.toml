[package]
name = "fastchrf"
version = "0.2.1"
edition = "2021"
description = "Fast computation of sentence-level ChrF, motivated by Minimum Bayes Risk decoding"
license = "Apache-2.0"
repository = "https://github.com/jvamvas/fastChrF"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fastchrf"
crate-type = ["cdylib"]

[dependencies]
pyo3 = "0.29.2"
rayon = "1.12.0"

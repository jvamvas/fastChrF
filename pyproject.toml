[build-system]
requires = ["maturin>=1.15,<2.0"]
build-backend = "maturin"

[project]
name = "fastchrf"
description = "Fast computation of sentence-level ChrF, motivated by Minimum Bayes Risk decoding"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Jannis Vamvas" }]
keywords = ["chrf", "mbr", "minimum-bayes-risk", "machine-translation", "nlp"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/jvamvas/fastChrF"
Repository = "https://github.com/jvamvas/fastChrF"
Issues = "https://github.com/jvamvas/fastChrF/issues"
Paper = "https://arxiv.org/abs/2402.04251"

[tool.maturin]
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
markers = [
    "slow: tests that download external datasets",
]
